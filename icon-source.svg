<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 轻笺图标：米白笺底 + 蕨绿双叶 + 万寿菊点缀（Botanical Garden 配色） -->
  <rect width="512" height="512" rx="116" fill="#f5f3ed"/>
  <g transform="translate(256 292)">
    <!-- 左叶 -->
    <path d="M0 0 C -14 -92 -64 -126 -114 -122 C -112 -62 -62 -14 0 0 Z"
          fill="#4a7c59" transform="rotate(-26)"/>
    <!-- 右叶（略浅） -->
    <path d="M0 0 C 14 -98 70 -130 118 -120 C 110 -58 62 -12 0 0 Z"
          fill="#6b9a74" transform="rotate(24)"/>
    <!-- 茎 -->
    <path d="M0 0 C -8 46 -10 96 -2 158" stroke="#4a7c59"
          stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 万寿菊点缀 -->
  <circle cx="392" cy="132" r="20" fill="#f9a620"/>
</svg>
